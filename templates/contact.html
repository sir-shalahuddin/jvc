<!DOCTYPE html>
<html lang="id" data-ui-style="brutalist">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fdfaf6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
    <title>Kontak - Retro</title>
    <meta name="description" content="Hubungi kami untuk pertanyaan, masukan, atau tambahan kuota Retro.">
    <script>
        (function () {
            var s = "brutalist";
            try {
                var v = localStorage.getItem("ui_theme_style");
                if (v === "modern" || v === "brutalist") s = v;
            } catch (e) {}
            document.documentElement.setAttribute("data-ui-style", s);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap">
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg?v=300">
    <link rel="stylesheet" href="/static/css/site.css?v=300">
</head>
<body>
    <header class="top wrap">
        <a class="brand" href="/" title="Retro"><span class="mark" aria-hidden="true">R</span><span class="word">Retro</span></a>
        <nav class="nav" aria-label="Utama">
            <a href="/about">Tentang</a>
            <a href="/contact" aria-current="page">Kontak</a>
            <a href="/dashboard">Dashboard</a>
        </nav>
    </header>

    <main class="wrap page">
        <h1>Kontak</h1>
        <p class="lead">Ada pertanyaan, masukan, atau butuh tambahan kuota? Hubungi kami.</p>

        <dl class="facts">
            <div>
                <dt>Email</dt>
                <dd>{{.ContactEmail}}</dd>
            </div>
            <div>
                <dt>WhatsApp / telepon</dt>
                <dd>{{.ContactPhone}}</dd>
            </div>
            <div>
                <dt>Alamat</dt>
                <dd>{{.ContactAddress}}</dd>
            </div>
        </dl>
    </main>

    <footer class="foot wrap">
        <span>retro.hanya.click</span>
        <span>Juga dari kami: <a href="https://hanya.click">hanya.click</a> &mdash; pemendek link</span>
    </footer>
</body>
</html>
