<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Session - Discussion</title>
    <meta name="description" content="Collaborate on agile feedback, submit anonymous cards, and see real-time AI sentiment analysis of your team's thoughts.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.quilljs.com">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;600;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"></noscript>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg?v=210">
    <link rel="stylesheet" href="/static/style.css?v=270">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        :root[data-theme='light'] { 
            --text-main: var(--text); 
            --text-sub: var(--text-secondary); 
            --card-bg: var(--bg-card); 
            --accent-primary: var(--primary); 
            --accent-success: #10b981; 
            --accent-danger: #f43f5e;
            --btn-text: #ffffff;
        }
        :root[data-theme='dark'] { 
            --text-main: var(--text); 
            --text-sub: var(--text-secondary); 
            --card-bg: var(--bg-card); 
            --accent-primary: var(--primary); 
            --accent-success: #34d399; 
            --accent-danger: #fb7185;
            --btn-text: #ffffff;
        }

        .session-header { padding: 3rem 0 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--border-color); margin-bottom: 3rem; }
        .header-actions { display: flex; gap: 0.75rem; align-items: center; }
        #sm-controls { display: flex; gap: 0.75rem; }
        .answers-grid { column-width: 320px; column-gap: 1.5rem; width: 100%; padding-top: 1rem; }
        .answer-card { break-inside: avoid; margin-bottom: 1.5rem; min-height: 280px; width: 100%; cursor: pointer; position: relative; transform-style: preserve-3d; perspective: 1000px; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.1); display: inline-block; }
        .answer-card.flipped { transform: rotateY(180deg); }
        .answer-card.processing { cursor: wait; pointer-events: none; }
        
        .card-face { position: relative; width: 100%; height: auto; min-height: 280px; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 0px !important; padding: 1.75rem; border: 3px solid var(--border-color); box-shadow: 6px 6px 0px var(--mood-color, var(--border-color)); backdrop-filter: none !important; -webkit-backdrop-filter: none !important; display: flex; flex-direction: column; transition: box-shadow var(--transition), border-color var(--transition), background var(--transition), color var(--transition); }
        .card-front { background: var(--bg-card); color: var(--primary); font-weight: 900; font-size: 1.5rem; justify-content: center; align-items: center; position: absolute; inset: 0; height: 100%; overflow: hidden; transform: rotateY(0deg) translateZ(1px); }
        .card-back { background: var(--bg-card); color: var(--text); transform: rotateY(180deg) translateZ(1px); position: relative; min-height: 280px; width: 100%; height: auto; }
        
        /* Transitions */
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .topic-container { display: none; }
        .topic-container.active { display: block; animation: fadeSlideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .topic-container.leaving { animation: fadeOut 0.3s forwards; }

        /* Sticky Header */
        .sticky-wrapper { position: sticky; top: 1.5rem; z-index: 500; margin-bottom: 2rem; pointer-events: none; }
        .question-header { 
            background: var(--bg-card); 
            backdrop-filter: none !important; 
            -webkit-backdrop-filter: none !important;
            border: 3px solid var(--border-color); 
            border-radius: 0px !important; 
            padding: 2rem 2.5rem; 
            box-shadow: 6px 6px 0px var(--border-color); 
            display: inline-flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
            pointer-events: auto; 
            width: 100%; 
            transition: all var(--transition);
        }
        :root[data-theme='dark'] .question-header { 
            background: var(--bg-card); 
            border-color: var(--border-color); 
            box-shadow: 6px 6px 0px var(--border-color);
        }

        /* Buttons & Rest */
        .btn { padding: 0.8rem 1.75rem; border-radius: 0px !important; font-weight: 800; font-family: 'JetBrains Mono', monospace !important; transition: all var(--transition); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 3px solid var(--border-color) !important; font-size: 0.95rem; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 3px 3px 0px var(--border-color) !important; border: none; }
        .btn-primary:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-color) !important; }
        .btn-primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-color) !important; }
        .btn-success { background: #10b981; color: white; box-shadow: 3px 3px 0px var(--border-color) !important; }
        .btn-success:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-color) !important; }
        .btn-ghost { background: var(--bg-card); border: 3px solid var(--border-color); color: var(--text); box-shadow: 3px 3px 0px var(--border-color) !important; }
        .btn-ghost:hover { border-color: var(--border-color); color: var(--primary); background: var(--bg-card); transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--border-color) !important; }
        .btn-ghost:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-color) !important; }

        #nav-questions { position: fixed; bottom: 2.5rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; background: var(--bg-card); padding: 1rem 2rem; border-radius: 0px !important; box-shadow: var(--glass-shadow); z-index: 1000; border: 3px solid var(--border-color); backdrop-filter: none !important; }
        .nav-dot { width: 12px; height: 12px; border-radius: 0px !important; background: var(--text-muted); cursor: pointer; transition: all var(--transition); border: 1px solid var(--border-color); }
        .nav-dot.active { background: var(--primary); transform: scale(1.3); border: 2px solid var(--border-color); }
        
        .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); background: var(--bg-card); backdrop-filter: none !important; border: 3px solid var(--border-color); border-radius: 0px !important; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--glass-shadow); z-index: 900; transition: all var(--transition); color: var(--primary); }
        .nav-btn:hover { background: var(--primary); color: white; transform: translateY(-50%) translate(-2px, -2px); box-shadow: 6px 6px 0px var(--border-color); }
        .nav-btn:active { transform: translateY(-50%) translate(2px, 2px); box-shadow: 2px 2px 0px var(--border-color); }
        .nav-btn.prev { left: 2rem; }
        .nav-btn.next { right: 2rem; }

        .modal-content { background: var(--bg-card); backdrop-filter: none !important; border: 3px solid var(--border-color); border-radius: 0px !important; padding: 3rem; position: relative; box-shadow: 8px 8px 0px var(--border-color); max-height: 90vh; overflow-y: auto; color: var(--text); }
        


        @media (max-width: 768px) {
            .session-header { flex-direction: column; align-items: flex-start; gap: 1.5rem; padding: 2rem 0 1rem; margin-bottom: 1.5rem; }
            .session-header h1 { font-size: 1.5rem !important; }
            .header-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
            #sm-controls { display: contents; }
            .header-actions .btn { width: 100%; padding: 0.8rem 0.5rem; font-size: 0.85rem; }
            
            .sticky-wrapper { top: 0.5rem; }
            .question-header { padding: 1rem 1.5rem; border-radius: 0px !important; }
            .question-header h2 { font-size: 1.5rem !important; }
            
            .nav-btn { width: 44px; height: 44px; top: auto; bottom: 2rem; transform: none; }
            .nav-btn:hover { transform: translate(-2px, -2px); }
            .nav-btn:active { transform: translate(2px, 2px); }
            .nav-btn.prev { left: 1rem; }
            .nav-btn.next { right: 1rem; }
            #nav-questions { bottom: 1.5rem; padding: 0.75rem 1.5rem; }
            
            .answers-grid { column-width: 100%; padding-top: 0.5rem; }
            .answer-card { min-height: 200px; margin-bottom: 1rem; }
            .card-face { min-height: 200px; padding: 1.25rem; border-radius: 0px !important; }
            .card-front { font-size: 1.25rem; }
        }

        /* AI Thinking Animation Styles (Neo-Brutalist) */
        .ai-thinking {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 1.25rem;
            background: var(--bg-card);
            padding: 2rem;
        }

        .ai-loader-icon {
            font-size: 3.5rem;
            font-weight: 900;
            display: inline-block;
            color: var(--primary);
            animation: steppedSpin 1.2s steps(8) infinite;
        }

        .ai-status {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--text);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 3px solid var(--border-color);
            padding: 6px 14px;
            background: var(--bg-base);
            box-shadow: 3px 3px 0px var(--border-color);
            animation: hardBlink 1.2s steps(2) infinite;
        }

        @keyframes steppedSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes hardBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.6; }
        }

        /* Neo-Brutalist Emoji/Emoticon & Subtitle Styles */
        .emoji-main {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 0.75rem;
            font-family: 'JetBrains Mono', monospace !important;
            color: var(--text);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.08);
        }

        .emoji-sub {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text);
            border: 3px solid var(--border-color);
            padding: 5px 12px;
            background: var(--bg-base);
            box-shadow: 3px 3px 0px var(--border-color);
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <a href="/" class="back-to-home danger">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Exit
    </a>
    <button class="sound-toggle" id="soundToggleBtn" onclick="SoundFX.toggle()" title="Toggle Sound FX">🔊</button>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme"><svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
    <div id="toast-container" style="position: fixed; top: 2rem; right: 2rem; z-index: 9999;"></div>

    <div class="container">
        <header class="session-header">
            <div>
                <h1 id="sessionNameTitle" style="font-size: 2rem; margin:0; color: var(--text-main);">Loading...</h1>
                <p id="sessionIdDisplay" style="color: var(--text-sub); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px;"></p>
            </div>
            <div class="header-actions">
                <div class="timer-widget">
                    <span style="font-size: 0.9rem;">⏱</span>
                    <div class="timer-digits-wrapper">
                        <input id="timerMin" class="timer-digit-input" type="text" maxlength="2" value="05" readonly inputmode="numeric" onfocus="onTimerDigitFocus(this)" onblur="onTimerDigitBlur()" onkeydown="onTimerDigitKeyDown(event, this)" title="Minutes (00-59)" />
                        <span class="timer-colon">:</span>
                        <input id="timerSec" class="timer-digit-input" type="text" maxlength="2" value="00" readonly inputmode="numeric" onfocus="onTimerDigitFocus(this)" onblur="onTimerDigitBlur()" onkeydown="onTimerDigitKeyDown(event, this)" title="Seconds (00-59)" />
                    </div>
                    <button id="timerPlayBtn" class="timer-btn primary hidden" onclick="startTimer()" title="Start Countdown">▶</button>
                    <button id="timerResetBtn" class="timer-btn hidden" onclick="resetTimer()" title="Reset Timer">↺</button>
                </div>
                <div class="vote-budget-badge" id="voteBudgetBadge" title="Your remaining dot votes for this retrospective">
                    🎯 <span id="voteBudgetCount">5</span>/5 Votes Left
                </div>
                <div id="sm-controls" class="hidden">
                    <button onclick="revealAllCards()" class="btn btn-ghost" style="border-color: var(--primary); color: var(--primary);">🪄 Reveal All</button>
                    <button onclick="openQuestionModal()" class="btn btn-success">+ Add Question</button>
                    <button onclick="downloadReport()" class="btn btn-ghost" style="border-color: var(--accent-primary); color: var(--accent-primary);">Export PDF</button>
                </div>
                <button onclick="copyInvite()" class="btn btn-ghost">Invite Team</button>
            </div>
        </header>

        <div id="questions-container"></div>
        <div id="nav-questions"></div>

        <div class="nav-btn prev" onclick="prevQuestion()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 18l-6-6 6-6"/></svg></div>
        <div class="nav-btn next" onclick="nextQuestion()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>

    <!-- Modals -->
    <div id="submitModal" class="modal-overlay hidden"><div class="modal-content" style="max-width: 650px;"><button onclick="closeSubmitModal()" style="position: absolute; top: 1.5rem; right: 1.5rem; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: var(--text-sub);">&times;</button><h2 id="modalQuestionTitle" style="font-size: 1.5rem; margin-bottom: 2rem;">Add Your Feedback</h2><div id="editor-wrapper" style="margin-bottom: 2rem;"><div id="editor-container" style="height: 150px;"></div></div><div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 1.5rem;"><div><label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-sub); margin-bottom: 0.75rem; text-transform: uppercase;">Alias</label><input type="text" id="authorName" placeholder="e.g. Captain Nemo" style="width: 100%;"></div><div><label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-sub); margin-bottom: 0.75rem; text-transform: uppercase;">GIF</label><input type="text" id="gifSearchQuery" placeholder="Search..." style="width: 100%;" oninput="debouncedSearch('gif-results', 'selectedGifUrl')"></div></div><div id="gif-results" class="gif-results"></div><input type="hidden" id="selectedGifUrl"><button id="sendAnswerBtn" class="btn btn-primary" style="width: 100%; margin-top: 2.5rem;">Post to Board</button></div></div>
    <div id="questionModal" class="modal-overlay hidden"><div class="modal-content" style="max-width: 650px;"><button onclick="closeQuestionModal()" style="position: absolute; top: 1.5rem; right: 1.5rem; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: var(--text-sub);">&times;</button><h2 id="qModalTitle" style="font-size: 1.5rem; margin-bottom: 1.5rem;">Edit Question</h2><input type="hidden" id="editQId"><div style="margin-bottom: 1.5rem;"><label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-sub); margin-bottom: 0.5rem; text-transform: uppercase;">Text</label><input type="text" id="qModalText" style="width: 100%;"></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;"><div><label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-sub); margin-bottom: 0.5rem; text-transform: uppercase;">GIF</label><input type="text" id="qGifSearch" oninput="debouncedSearch('q-gif-results', 'qModalGif')" style="width: 100%;"></div><div><label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--text-sub); margin-bottom: 0.5rem; text-transform: uppercase;">Upload</label><input type="file" onchange="handleFileUpload(this, 'qModalGif')" style="width: 100%;"></div></div><div id="q-gif-results" class="gif-results"></div><div id="q-preview" style="text-align: center;"></div><input type="hidden" id="qModalGif"><div style="display: flex; gap: 1rem; margin-top: 2rem;"><button onclick="saveQuestion()" class="btn btn-primary" style="flex: 2;">Save</button><button id="deleteQBtn" onclick="deleteQuestion()" class="btn btn-ghost" style="flex: 1; color: var(--accent-danger); border-color: var(--accent-danger);">Delete</button></div></div></div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js" defer></script>
    <script>
        // ==========================================
        // Modern Tactile UI Sound FX Engine (Web Audio API)
        // ==========================================
        const SoundFX = {
            audioCtx: null,
            muted: localStorage.getItem('retro_sound_muted') === 'true',
            init() {
                if (!this.audioCtx && (window.AudioContext || window.webkitAudioContext)) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            toggle() {
                this.muted = !this.muted;
                localStorage.setItem('retro_sound_muted', this.muted);
                updateSoundIcon();
                if (!this.muted) this.playVote();
            },
            // High-quality tactile card flip / pop
            playFlip() {
                if (this.muted) return;
                this.init();
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const ctx = this.audioCtx;
                    const now = ctx.currentTime;
                    
                    // Main frequency pitch-drop pop
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const filter = ctx.createBiquadFilter();
                    
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1800, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + 0.08);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(580, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);

                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.08);

                    // Wooden tactile sub-click
                    const clickOsc = ctx.createOscillator();
                    const clickGain = ctx.createGain();
                    clickOsc.type = 'triangle';
                    clickOsc.frequency.setValueAtTime(240, now);
                    clickOsc.frequency.exponentialRampToValueAtTime(60, now + 0.04);
                    clickGain.gain.setValueAtTime(0.12, now);
                    clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    clickOsc.connect(clickGain);
                    clickGain.connect(ctx.destination);
                    clickOsc.start(now);
                    clickOsc.stop(now + 0.04);
                } catch(e) {}
            },
            // Satisfying crystal joycon / waterdrop chime
            playVote() {
                if (this.muted) return;
                this.init();
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const ctx = this.audioCtx;
                    const now = ctx.currentTime;
                    
                    // Fundamental chime
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(880, now); // A5
                    gain1.gain.setValueAtTime(0.15, now);
                    gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.18);

                    // Overtone shimmer
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1760, now); // A6
                    gain2.gain.setValueAtTime(0.07, now);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(now);
                    osc2.stop(now + 0.12);
                } catch(e) {}
            },
            // Modern warm level-up chord (Slack / Discord message pop)
            playPost() {
                if (this.muted) return;
                this.init();
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const ctx = this.audioCtx;
                    const now = ctx.currentTime;
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major
                    notes.forEach((freq, idx) => {
                        const noteTime = now + (idx * 0.045);
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, noteTime);
                        gain.gain.setValueAtTime(0.12, noteTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + 0.22);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(noteTime);
                        osc.stop(noteTime + 0.22);
                    });
                } catch(e) {}
            },
            // Ambient meeting bell / Tibetan gong for timer finish
            playAlarm() {
                if (this.muted) return;
                this.init();
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const ctx = this.audioCtx;
                    const now = ctx.currentTime;
                    const chord = [392.00, 587.33, 783.99, 1174.66]; // G Major pentatonic
                    chord.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + (idx * 0.08));
                        gain.gain.setValueAtTime(0.14, now + (idx * 0.08));
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + (idx * 0.08));
                        osc.stop(now + 1.2);
                    });
                } catch(e) {}
            },
            // Tension tick / heartbeat for countdown panic mode (<= 10s)
            playTick(isUrgent = false) {
                if (this.muted) return;
                this.init();
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const ctx = this.audioCtx;
                    const now = ctx.currentTime;
                    const freq = isUrgent ? 880 : 520;
                    
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = isUrgent ? 'sawtooth' : 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    osc.frequency.exponentialRampToValueAtTime(160, now + 0.05);
                    gain.gain.setValueAtTime(isUrgent ? 0.16 : 0.09, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);

                    if (isUrgent) {
                        // Heartbeat sub-thump
                        const subOsc = ctx.createOscillator();
                        const subGain = ctx.createGain();
                        subOsc.type = 'sine';
                        subOsc.frequency.setValueAtTime(140, now);
                        subOsc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                        subGain.gain.setValueAtTime(0.2, now);
                        subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                        subOsc.connect(subGain);
                        subGain.connect(ctx.destination);
                        subOsc.start(now);
                        subOsc.stop(now + 0.08);
                    }
                } catch(e) {}
            },
            // Cascading fairy sparkle for Reveal All
            playRevealCascade(count = 6) {
                if (this.muted) return;
                this.init();
                if (!this.audioCtx) return;
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                try {
                    const ctx = this.audioCtx;
                    const now = ctx.currentTime;
                    const scale = [440, 493.88, 554.37, 659.25, 739.99, 880, 987.77, 1108.73];
                    for (let i = 0; i < count; i++) {
                        const noteTime = now + (i * 0.07);
                        const freq = scale[i % scale.length];
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, noteTime);
                        gain.gain.setValueAtTime(0.09, noteTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + 0.18);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(noteTime);
                        osc.stop(noteTime + 0.18);
                    }
                } catch(e) {}
            }
        };

        function onTimerDigitFocus(input) {
            if (!isModerator) return;

        async function onTimerDigitBlur() {
            if (!isModerator) return;
            isEditingTimer = false;
            const minEl = document.getElementById('timerMin');
            const secEl = document.getElementById('timerSec');
            if (!minEl || !secEl) return;
            
            let m = parseInt(minEl.value) || 0;
            let s = parseInt(secEl.value) || 0;
            
            if (m < 0) m = 0;
            if (m > 59) m = 59;
            if (s < 0) s = 0;
            if (s > 59) s = 59;
            
            minEl.value = String(m).padStart(2, '0');
            secEl.value = String(s).padStart(2, '0');
            
            timerSeconds = (m * 60) + s;
            if (timerSeconds <= 0) timerSeconds = 60;
            
            try {
                await fetch('/api/session/timer/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, action: 'reset', seconds: timerSeconds })
                });
            } catch(e) {}
        }

        function onTimerDigitKeyDown(e, input) {
            if (!isModerator) return;
            // Navigation & control keys allowed
            if (['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) {
                return;
            }
            if (e.key === 'Enter') {
                input.blur();
                startTimer();
                return;
            }
            // Only allow numbers 0-9
            if (!/^\d$/.test(e.key)) {
                e.preventDefault();
                return;
            }
            // Auto advance from minutes to seconds if 2 digits entered
            if (input.id === 'timerMin') {
                setTimeout(() => {
                    const secEl = document.getElementById('timerSec');
                    if (secEl && input.value.length >= 2) secEl.focus();
                }, 10);
            }
        }

        function updateTimerDisplay() {
            const minEl = document.getElementById('timerMin');
            const secEl = document.getElementById('timerSec');
            const colonEl = document.querySelector('.timer-colon');
            const widget = document.querySelector('.timer-widget');
            const resetBtn = document.getElementById('timerResetBtn');
            const playSubBtn = document.getElementById('timerPlaySubBtn');
            
            if (!minEl || !secEl) return;
            
            const m = Math.floor(Math.max(0, timerSeconds) / 60);
            const s = Math.max(0, timerSeconds) % 60;
            
            if (!isEditingTimer) {
                minEl.value = String(m).padStart(2, '0');
                secEl.value = String(s).padStart(2, '0');
            }

            // Play button: visible ONLY to SM when timer is NOT running
            const playBtn = document.getElementById('timerPlayBtn');
            if (playBtn) {
                if (isModerator && !timerRunning) {
                    playBtn.classList.remove('hidden');
                } else {
                    playBtn.classList.add('hidden');
                }
            }

            // Reset button: visible ONLY to SM when timer is running
            if (resetBtn) {
                if (isModerator && timerRunning) {
                    resetBtn.classList.remove('hidden');
                } else {
                    resetBtn.classList.add('hidden');
                }
            }
            
            // Panic Mode Thresholds
            const isPanic = timerSeconds <= 10 && timerSeconds > 0 && timerRunning;
            const isUrgent = timerSeconds <= 30 && timerSeconds > 0 && timerRunning;
            
            if (isPanic) {
                minEl.classList.add('panic-mode');
                secEl.classList.add('panic-mode');
                if (colonEl) colonEl.classList.add('panic-mode');
                if (widget) widget.classList.add('panic-mode');
                minEl.classList.remove('pulse-urgent');
                secEl.classList.remove('pulse-urgent');
            } else if (isUrgent) {
                minEl.classList.add('pulse-urgent');
                secEl.classList.add('pulse-urgent');
                if (colonEl) colonEl.classList.add('pulse-urgent');
                minEl.classList.remove('panic-mode');
                secEl.classList.remove('panic-mode');
                if (colonEl) colonEl.classList.remove('panic-mode');
                if (widget) widget.classList.remove('panic-mode');
            } else {
                minEl.classList.remove('pulse-urgent', 'panic-mode');
                secEl.classList.remove('pulse-urgent', 'panic-mode');
                if (colonEl) colonEl.classList.remove('pulse-urgent', 'panic-mode');
                if (widget) widget.classList.remove('panic-mode');
            }
        }

        // Local smooth 500ms tick for instant countdown
        setInterval(() => {
            if (timerRunning && timerEndTimeMs > 0) {
                const rem = Math.round((timerEndTimeMs - Date.now()) / 1000);
                timerSeconds = Math.max(0, rem);
                
                // Trigger Panic Ticks for last 10 seconds
                if (timerSeconds <= 10 && timerSeconds > 0 && timerSeconds !== lastTickedSecond) {
                    lastTickedSecond = timerSeconds;
                    SoundFX.playTick(timerSeconds <= 5);
                }
                
                updateTimerDisplay();
                if (timerSeconds === 0 && !alarmTriggered) {

                    timerRunning = false;
                    SoundFX.playAlarm();
                    showToast("🚨 TIME'S UP! Wrap up your reflection cards!", "error");

                const data = await res.json();

                    alarmTriggered = false;
                } else {
                    timerSeconds = data.remaining_seconds;
                    if (timerSeconds > 0) alarmTriggered = false;
                }
                
                updateTimerDisplay();
            } catch (e) {}
        }

        function getRetroEmoticon(emoji, emotion) {
            const emotionLower = (emotion || "").toLowerCase();
            if (emotionLower.includes("joy") || emotionLower.includes("happy") || emotionLower.includes("success") || emotionLower.includes("love") || emotionLower.includes("positive")) {
                return "(ᵔ◡ᵔ)";
            }
            if (emotionLower.includes("anger") || emotionLower.includes("angry") || emotionLower.includes("frustrated") || emotionLower.includes("bad") || emotionLower.includes("critical") || emotionLower.includes("negative")) {
                return "(ಠ_ಠ)";
            }
            if (emotionLower.includes("confused") || emotionLower.includes("confusion") || emotionLower.includes("unclear") || emotionLower.includes("question") || emotionLower.includes("doubt")) {
                return "(⊙_⊙)";
            }
            if (emotionLower.includes("sad") || emotionLower.includes("disappointed") || emotionLower.includes("worry") || emotionLower.includes("fail") || emotionLower.includes("regret")) {
                return "(︶︹︶)";
            }
            if (emotionLower.includes("neutral") || emotionLower.includes("ok") || emotionLower.includes("normal") || emotionLower.includes("indifferent")) {
                return "( -_- )";
            }

            if (!emoji) return "(._.)";
            if (["😃","😊","🎉","👍","😀","😁","😆","😸","❤️","✨"].some(e => emoji.includes(e))) return "(ᵔ◡ᵔ)";
            if (["😡","😠","👿","👎","🤬","😤","💢"].some(e => emoji.includes(e))) return "(ಠ_ಠ)";
            if (["😕","🤔","❓","❔","🧐","🤷","🛸"].some(e => emoji.includes(e))) return "(⊙_⊙)";
            if (["😢","😭","😞","😞","🥺","💔"].some(e => emoji.includes(e))) return "(︶︹︶)";
            if (["⚠️","🚨","⚡","🔥"].some(e => emoji.includes(e))) return "(°ロ°!)";

            return emoji;
        }

        // ==========================================

        function getDeviceFingerprint() {
            try {
                let cached = sessionStorage.getItem('retro_dev_fp');
                if (cached) return cached;
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('RetroGCP,2026', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('RetroGCP,2026', 4, 17);
                
                const str = [
                    canvas.toDataURL(),
                    navigator.userAgent,
                    navigator.language,
                    screen.colorDepth,
                    screen.width + 'x' + screen.height,
                    new Date().getTimezoneOffset()
                ].join('###');
                
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                const fp = 'fp_' + Math.abs(hash).toString(16);
                sessionStorage.setItem('retro_dev_fp', fp);
                return fp;
            } catch(e) {
                return 'fp_fallback_' + Math.random().toString(36).substring(2, 9);
            }
        }

        async function syncVoterStatus() {
            try {
                const fp = getDeviceFingerprint();
                const res = await fetch(`/api/session/voter-status?session_id=${sessionId}&device_fingerprint=${fp}`);
                if (res.ok) {
                    const data = await res.json();
                    voterRemainingVotes = typeof data.remaining_votes === 'number' ? data.remaining_votes : 5;
                    voterVotedCards = data.voted_answers || [];
                    localStorage.setItem('voted_cards', JSON.stringify(voterVotedCards));
                    updateVoteBudgetUI();
                }
            } catch(e) {}
        }

        function updateVoteBudgetUI() {
            const badge = document.getElementById('voteBudgetBadge');
            const countEl = document.getElementById('voteBudgetCount');
            if (countEl) countEl.innerText = voterRemainingVotes;
            if (badge) {
                if (voterRemainingVotes === 0) {
                    badge.classList.add('exhausted');
                    badge.title = "All 5 dot votes have been used";
                } else {
                    badge.classList.remove('exhausted');
                    badge.title = `${voterRemainingVotes} dot votes remaining`;
                }
            }
            
            document.querySelectorAll('.card-vote-btn').forEach(btn => {
                const card = btn.closest('.answer-card');
                if (!card) return;
                const cardId = card.dataset.id;
                if (voterVotedCards.includes(cardId)) {
                    btn.classList.add('has-voted');
                    btn.classList.remove('disabled-quota');
                    btn.title = "You upvoted this card";
                } else if (voterRemainingVotes <= 0) {
                    btn.classList.add('disabled-quota');
                    btn.title = "All 5 dot votes have been used!";
                } else {
                    btn.classList.remove('disabled-quota');
                    btn.title = "Upvote feedback";
                }
            });
        }

        async function voteCard(id) {
            SoundFX.playVote();
            const fp = getDeviceFingerprint();
            
            if (voterVotedCards.includes(id)) {
                showToast("You've already upvoted this card!", "info");
                return;
            }
            
            if (voterRemainingVotes <= 0) {
                showToast("🎯 You've reached your 5-vote limit for this session!", "info");
                return;
            }

            // Optimistic UI updates
            voterVotedCards.push(id);
            voterRemainingVotes = Math.max(0, voterRemainingVotes - 1);
            localStorage.setItem('voted_cards', JSON.stringify(voterVotedCards));
            updateVoteBudgetUI();

            document.querySelectorAll(`.answer-card[data-id="${id}"] .card-vote-btn`).forEach(btn => {
                btn.classList.add('has-voted');
                const span = btn.querySelector('span');
                if (span) span.innerText = parseInt(span.innerText || '0') + 1;
            });
            
            try {
                const res = await fetch('/api/answer/vote', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Device-Fingerprint': fp
                    },
                    body: JSON.stringify({ 
                        session_id: sessionId, 
                        answer_id: id,
                        device_fingerprint: fp
                    })
                });
                
                const data = await res.json();
                if (res.ok) {
                    if (typeof data.remaining_votes === 'number') {
                        voterRemainingVotes = data.remaining_votes;
                    }
                    showToast(`👍 Vote counted! (${voterRemainingVotes} votes left)`, "success");
                    loadAnswers();
                } else {
                    showToast(data.message || "Could not record vote", "error");
                    syncVoterStatus();
                }
            } catch(e) {
                syncVoterStatus();
            }
        }

        function revealAllCards() {
            const cards = document.querySelectorAll(`#answers-${activeQuestionId} .answer-card`);
            if (cards.length === 0) return showToast("No cards to reveal yet!", "info");
            SoundFX.playRevealCascade(Math.min(cards.length, 8));
            cards.forEach((card, idx) => {
                setTimeout(() => {
                    card.classList.add('flipped');
                }, idx * 90);
            });
            showToast("🪄 All cards revealed!", "success");
        }

        async function loadMoreAnswers() {
            if (isLoadingMore) return;
            const page = questionPagination[activeQuestionId];
            if (!page || !page.hasMore) return;
            
            isLoadingMore = true;
            page.limit += 12;
            await loadAnswers();
            isLoadingMore = false;
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 150) {
                loadMoreAnswers();
            }
        });

        // Common Logic (Gifs, Upload, PDF, CRUD)
        function debouncedSearch(resultId, inputId) { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => searchGifs(resultId, inputId), 600); }
        async function searchGifs(resultId, inputId) { const query = (resultId === 'q-gif-results' ? document.getElementById('qGifSearch') : document.getElementById('gifSearchQuery')).value.trim(); if (query.length < 2) return; const res = await fetch(`/api/gifs/search?q=${encodeURIComponent(query)}`); const data = await res.json(); if (data.data) document.getElementById(resultId).innerHTML = data.data.map(g => `<img src="${g.images.fixed_height_small.url}" class="gif-item" onclick="selectGif('${g.images.fixed_height.url}', this, '${resultId}', '${inputId}')">`).join(''); }
        function selectGif(url, el, resultId, inputId) { document.getElementById(inputId).value = url; document.querySelectorAll(`#${resultId} .gif-item`).forEach(i => i.classList.remove('selected')); el.classList.add('selected'); if (resultId === 'q-gif-results') document.getElementById('q-preview').innerHTML = `<img src="${url}" style="max-height: 100px; border-radius: 0px; border: 3px solid var(--border-color); margin-top: 1rem;">`; }
        async function handleFileUpload(input, targetInputId) { const file = input.files[0]; if (!file) return; const fd = new FormData(); fd.append('image', file); try { const res = await fetch('/api/upload', { method: 'POST', body: fd }); const data = await res.json(); if (data.url) { document.getElementById(targetInputId).value = data.url; if (targetInputId === 'qModalGif') document.getElementById('q-preview').innerHTML = `<img src="${data.url}" style="max-height: 100px; border-radius: 0px; border: 3px solid var(--border-color); margin-top: 1rem;">` ; showToast("Uploaded!", "success"); } } catch (e) { showToast("Failed", "error"); } }
        function openQuestionModal(id = '', text = '', gif = '') { document.getElementById('editQId').value = id; document.getElementById('qModalText').value = text; document.getElementById('qModalGif').value = gif; document.getElementById('qModalTitle').innerText = id ? 'Edit' : 'Add'; document.getElementById('q-preview').innerHTML = gif ? `<img src="${gif}" style="max-height: 100px; border-radius: 0px; border: 3px solid var(--border-color); margin-top: 1rem;">` : ''; document.getElementById('deleteQBtn').style.display = id ? 'block' : 'none'; document.getElementById('questionModal').classList.remove('hidden'); }
        function closeQuestionModal() { document.getElementById('questionModal').classList.add('hidden'); }
        async function saveQuestion() { const id = document.getElementById('editQId').value; const t = document.getElementById('qModalText').value; const g = document.getElementById('qModalGif').value; const res = await fetch(id ? '/api/question/update' : '/api/question/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, id: id || undefined, text: t, gif_url: g }) }); if (res.ok) { closeQuestionModal(); loadQuestions(); showToast("Saved", "success"); } }
        async function deleteQuestion() { const id = document.getElementById('editQId').value; if (!confirm("Delete?")) return; const res = await fetch('/api/question/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, id: id }) }); if (res.ok) { closeQuestionModal(); loadQuestions(); showToast("Deleted", "error"); } }
        function openSubmitModal(id, text) { activeQuestionId = id; document.getElementById('modalQuestionTitle').innerText = text; document.getElementById('submitModal').classList.remove('hidden'); quill.setContents([]); document.getElementById('selectedGifUrl').value = ''; }
        function closeSubmitModal() { document.getElementById('submitModal').classList.add('hidden'); }
        document.getElementById('sendAnswerBtn').onclick = async () => { 
            const t = quill.root.innerHTML; 
            const a = document.getElementById('authorName').value; 
            const g = document.getElementById('selectedGifUrl').value; 
            if (quill.getText().trim().length < 2) return showToast("Empty", "error"); 
            try { 
                const res = await fetch('/api/answer/submit', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ session_id: sessionId, question_id: activeQuestionId, text: t, author_name: a, gif_url: g }) 
                }); 
                if (res.ok) { 
                    SoundFX.playPost();
                    closeSubmitModal(); 
                    loadAnswers(); 
                    showToast("Sent!", "success"); 
                } 
            } finally {} 
        };
        function downloadReport() { window.open(`/api/session/report?session_id=${sessionId}`, '_blank'); }
        function copyInvite() { navigator.clipboard.writeText(window.location.origin + "/session/?id=" + sessionId); showToast("Copied!", "success"); }
        function showToast(m, t) { const c = document.getElementById('toast-container'); const toast = document.createElement('div'); toast.style.cssText = `background: var(--bg-card); color: var(--text); padding: 1rem 1.5rem; border-radius: 0px; border: 3px solid var(--border-color); margin-bottom: 0.75rem; animation: fadeUp 0.4s; box-shadow: var(--glass-shadow); font-weight: 800; font-family: 'JetBrains Mono', monospace;`; toast.innerHTML = `<span>${m}</span>`; c.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3500); }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
