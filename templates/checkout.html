<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Retro</title>
    <meta name="description" content="Unlock advanced AI-driven features and choose a session credits plan that matches your team's velocity.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;600;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet"></noscript>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg?v=210">
    <link rel="stylesheet" href="/static/style.css?v=283">
    <link rel="stylesheet" href="/static/css/checkout.css?v=283">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <a href="/" class="back-to-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Pricing
    </a>

    <div class="container animate-fade-up">
        <h1 style="font-size: 3rem; margin-bottom: 2rem;">Secure Checkout</h1>
        <div class="checkout-grid">
            <div class="card" id="methodsCard">
                <div class="section-title">
                    <div class="step-num step-primary">1</div>
                    Select Payment Method
                </div>
                
                <div id="loader"><div class="spinner"></div></div>
                <div id="methodsContainer" class="methods-grid" style="display: none;"></div>
            </div>

            <div class="card" id="summaryCard">
                <div class="section-title">
                    <div class="step-num step-accent">2</div>
                    Order Summary
                </div>
                
                <div id="orderSummary">
                    <div class="summary-item">
                        <span id="prodName">Loading...</span>
                        <span id="prodPrice">Rp 0</span>
                    </div>
                    <div class="summary-item" style="font-size: 0.9rem; color: var(--text-muted);">
                        <span id="prodDesc">...</span>
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="totalPrice">Rp 0</span>
                    </div>
                </div>

                <button id="payBtn" class="btn btn-primary btn-pay" disabled onclick="handlePayment()">Confirm & Pay</button>
                <p style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 1.5rem;">
                    Secure checkout powered by Duitku.
                </p>
            </div>

            <div class="card" id="instructionCard" style="display: none;">
                <div class="section-title">
                    <div class="step-num step-success">✓</div>
                    Payment Instructions
                </div>
                
                <div id="instructionContent" style="text-align: center; padding: 1rem 0;">
                    <!-- Dynamically filled -->
                </div>

                <a href="/" class="btn btn-ghost" style="width: 100%; margin-top: 2rem;">I have completed payment</a>
            </div>
        </div>
    </div>

    <script src="/static/js/checkout.js?v=283"></script>
</body>
</html>
